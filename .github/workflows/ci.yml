name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Export local Supabase JWT credentials
        run: |
          STATUS=$(supabase status --output json 2>/dev/null)
          ANON_KEY=$(echo "$STATUS" | jq -r '.ANON_KEY')
          SERVICE_KEY=$(echo "$STATUS" | jq -r '.SERVICE_ROLE_KEY')
          echo "NEXT_PUBLIC_SUPABASE_LOCAL_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_LOCAL_PUBLISHABLE_KEY=${ANON_KEY}" >> $GITHUB_ENV
          echo "SUPABASE_LOCAL_SECRET_KEY=${SERVICE_KEY}" >> $GITHUB_ENV

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build