name: Draws Scraper

on:
  schedule:
    - cron: '0 6 */2 * *'
  push:
    branches: [develop]
    paths: ['scrapers/**']
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      contents: read


    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Debug — print raw markdown from Canada draws page
        working-directory: scrapers
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python - <<'EOF'
          import os, time
          from firecrawl import FirecrawlApp
          app = FirecrawlApp(api_key=os.environ["FIRECRAWL_API_KEY"])
          result = app.scrape_url(
              "https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/submit-profile/rounds-invitations.html",
              params={"formats": ["markdown"]}
          )
          md = result.get("markdown", "NO MARKDOWN RETURNED")
          print("=== RAW MARKDOWN (first 3000 chars) ===")
          print(md[:3000])
          print("=== END RAW MARKDOWN ===")
          EOF

      - name: Run draws scraper
        working-directory: scrapers
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m scrapers.draws_scraper

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Draws scraper failed — ' + new Date().toISOString().split('T')[0],
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['scraper', 'bug']
            })
