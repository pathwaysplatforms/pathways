# Pathways — Immigration Sources Configuration
# Canada-only scope. Deep crawl enabled for major sections.
# crawl_depth: 0 = single page
# crawl_depth: 1 = page + direct links
# crawl_depth: 2 = page + links + their links (most comprehensive)
# use_browser: false = plain HTTP fetch (SSR sites); true = Playwright/Crawl4AI (JS-heavy sites)

pathways:
  canada:

    # Express Entry — flagship pathway, needs maximum depth
    express_entry:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry.html
      crawl_depth: 2
      use_browser: false
      visa_type: express_entry
      country: canada

    # Express Entry eligibility detail pages
    express_entry_fsw:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/eligibility/federal-skilled-workers.html
      crawl_depth: 1
      use_browser: false
      visa_type: express_entry_fsw
      country: canada

    express_entry_cec:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/eligibility/canadian-experience-class.html
      crawl_depth: 1
      use_browser: false
      visa_type: express_entry_cec
      country: canada

    express_entry_fst:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/eligibility/skilled-trades.html
      crawl_depth: 1
      use_browser: false
      visa_type: express_entry_fst
      country: canada

    # CRS — critical for score calculators
    express_entry_crs:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/eligibility/criteria-comprehensive-ranking-system/grid.html
      crawl_depth: 1
      use_browser: false
      visa_type: express_entry_crs
      country: canada

    # Documents and application
    express_entry_documents:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/documents.html
      crawl_depth: 1
      use_browser: false
      visa_type: express_entry
      country: canada

    # Provincial Nominee Programs
    pnp_overview:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/provincial-nominees.html
      crawl_depth: 1
      use_browser: false
      visa_type: pnp
      country: canada

    pnp_ontario:
      urls:
        - https://www.ontario.ca/page/ontario-immigrant-nominee-program-oinp
      crawl_depth: 1
      use_browser: false
      visa_type: pnp_ontario
      country: canada

    pnp_bc:
      urls:
        - https://www.welcomebc.ca/immigrate-to-b-c/bc-provincial-nominee-program
      crawl_depth: 1
      use_browser: true
      visa_type: pnp_bc
      country: canada

    pnp_alberta:
      urls:
        - https://www.alberta.ca/alberta-immigrant-nominee-program
      crawl_depth: 1
      use_browser: true
      visa_type: pnp_alberta
      country: canada

    # Family sponsorship
    family_sponsorship:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/family-sponsorship.html
      crawl_depth: 2
      use_browser: false
      visa_type: family_sponsorship
      country: canada

    # Work permits
    work_permits:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/work-canada/permit.html
      crawl_depth: 1
      use_browser: false
      visa_type: work_permit
      country: canada

    lmia:
      urls:
        - https://www.canada.ca/en/employment-social-development/services/foreign-workers.html
      crawl_depth: 1
      use_browser: false
      visa_type: lmia
      country: canada

    # Study permits
    study_permits:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada.html
      crawl_depth: 1
      use_browser: false
      visa_type: study_permit
      country: canada

    # Citizenship
    citizenship:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/canadian-citizenship.html
      crawl_depth: 2
      use_browser: false
      visa_type: citizenship
      country: canada

    # Permanent residence pathways
    permanent_residence:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada.html
      crawl_depth: 1
      use_browser: false
      visa_type: permanent_residence
      country: canada

    # Processing times — critical user question
    processing_times:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/application/check-processing-times.html
      crawl_depth: 0
      use_browser: false
      visa_type: processing_times
      country: canada

    # Settlement and integration
    settlement:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/new-immigrants.html
      crawl_depth: 1
      use_browser: false
      visa_type: settlement
      country: canada

    # Atlantic Immigration Program — employer-driven PR pathway for Atlantic provinces
    atlantic_immigration:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/atlantic-immigration.html
      crawl_depth: 1
      use_browser: false
      visa_type: atlantic_immigration
      country: canada

    # Rural and Northern Immigration Pilot — community-driven PR for smaller communities
    # Note: RNIP was discontinued after March 2024; page retained for historical reference.
    rural_northern_immigration:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/rural-northern-immigration-pilot.html
      crawl_depth: 0
      use_browser: false
      visa_type: rural_northern_immigration
      country: canada

    # Start-up Visa — PR pathway for innovative entrepreneurs backed by designated orgs
    startup_visa:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/start-visa.html
      crawl_depth: 1
      use_browser: false
      visa_type: startup_visa
      country: canada

    # Caregiver pathways — Home Child Care Provider and Home Support Worker pilots
    caregiver:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/caregivers.html
      crawl_depth: 1
      use_browser: false
      visa_type: caregiver
      country: canada

    # Refugee and humanitarian protection — overview only (crawl_depth 0)
    refugees_humanitarian:
      urls:
        - https://www.canada.ca/en/immigration-refugees-citizenship/services/refugees.html
      crawl_depth: 0
      use_browser: false
      visa_type: refugees_humanitarian
      country: canada

draws:
  canada_express_entry_latest:
    url: https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/submit-profile/rounds-invitations.html
    use_browser: false
    country: canada
    program: express_entry
    parser: canada_draws

  canada_express_entry_history:
    url: https://www.canada.ca/en/immigration-refugees-citizenship/corporate/mandate/policies-operational-instructions-agreements/ministerial-instructions/express-entry-rounds.html
    use_browser: false
    country: canada
    program: express_entry
    parser: canada_draws
