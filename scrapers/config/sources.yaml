draws:
  canada_express_entry:
    # Primary: direct fetch of the IRCC WET rounds JSON (stable URL, full history,
    # both the latest-rounds and ministerial-instructions pages render from it).
    # Fallback: the rounds-invitations HTML page, from which the parser can
    # re-discover the JSON endpoint or scrape the table/bullet layout.
    json_url: https://www.canada.ca/content/dam/ircc/documents/json/ee_rounds_123_en.json
    url: https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/submit-profile/rounds-invitations.html
    use_browser: false
    content_type: html
    country: canada
    program: express_entry
    parser: canada_draws

pool_snapshots:
  canada_ee_pool_rounds_json:
    # Primary: the same IRCC rounds JSON carries the CRS pool distribution per
    # round (dd1–dd18 + drawDistributionAsOn) — no separate dataset needed.
    json_url: https://www.canada.ca/content/dam/ircc/documents/json/ee_rounds_123_en.json
    country: canada
    program: express_entry
    parser: canada_pool_snapshots

  canada_ee_pool_results_page:
    # HTML fallback — IRCC pool statistics results page
    url: https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/submit-profile/rounds-invitations/results.html
    content_type: html
    country: canada
    program: express_entry
    parser: canada_pool_snapshots
